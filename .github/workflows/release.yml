name: release

# Publishes to npm and creates the GitHub Release when a v* tag is pushed. The
# tag is normally created by scripts/release.mjs (`pnpm release <version>`),
# which runs the same guards locally and pushes the tag but does NOT publish.
# This workflow is the single place that publishes, so the two can never race.
# It re-runs the guards in CI, publishes with provenance, then cuts the Release
# with the matching CHANGELOG section as its notes.
#
# PREREQUISITE that cannot be configured in this file: npm-side trusted
# publishing. On npmjs.com, open the @liustack/modlens package settings ->
# "Trusted publishers" and add this repository and this workflow
# (liustack/modlens, .github/workflows/release.yml). That lets npm mint a
# short-lived credential from the OIDC token this workflow requests, so no
# long-lived NPM_TOKEN secret is needed. Until it is set up, `npm publish
# --provenance` will fail with an authentication error. The workflow side of the
# handshake is the `id-token: write` permission below and an npm new enough to
# support OIDC trusted publishing (installed explicitly).

on:
  push:
    tags:
      - 'v*'

permissions:
  # write is needed to create the GitHub Release from the pushed tag.
  contents: write
  # Required for provenance and OIDC trusted publishing.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # OIDC trusted publishing and --provenance need npm 11.5.1+, newer than
      # what Node 22 ships with.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      # Same guards release.mjs runs, before anything irreversible.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Idempotent: a manual publish (e.g. during a registry or Actions
      # incident) must not turn this run red when the tag arrives later.
      - name: Publish to npm (skipped when the version is already live)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').name")"
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG@$VERSION is already on the registry; skipping publish."
          else
            npm publish --provenance --access public
          fi
      - name: Create GitHub Release from the tag and CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull this version's section out of CHANGELOG.md: from its "## <version>"
          # heading up to the next "## " heading.
          awk -v ver="$version" '
            $0 == "## " ver || index($0, "## " ver " ") == 1 { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $version" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
